<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rana Enamorada</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: linear-gradient(to bottom, #a8e6cf, #dbede6);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }
    canvas {
      background: #88c999;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }
  </style>
</head>
<body>

  <canvas id="canvas" width="800" height="500"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // Estados de la animación: 'JUMPING', 'FLY_WAIT', 'CATCHING', 'SWALLOWING', 'SHOWING_LETTER', 'EXPLODING', 'HEARTS'
    let state = 'JUMPING';
    let frame = 0;

    // Configuración de la Rana
    const frog = {
      x: -80,
      y: 380,
      baseY: 380,
      width: 70,
      height: 60,
      vx: 3.5,
      vy: 0,
      isGrounded: true,
      tongueProgress: 0, // 0 a 1
      mouthOpen: false,
      swallowScale: 1
    };

    // Configuración de la Mosca
    const fly = {
      x: 850,
      y: 180,
      vx: -2.5,
      vy: 0,
      caught: false,
      visible: true
    };

    // Configuración de la Carta
    const letter = {
      yOffset: 0,
      scale: 0,
      text: "Te Amo ❤️"
    };

    // Partículas (Corazones)
    let particles = [];

    // --- BUCLE PRINCIPAL ---
    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      drawBackground();
      updateLogic();
      
      if (fly.visible) drawFly();
      drawFrog();
      if (state === 'SHOWING_LETTER') drawLetter();
      drawParticles();

      frame++;
      requestAnimationFrame(animate);
    }

    // --- LÓGICA DE ESTADOS ---
    function updateLogic() {
      // 1. La rana entra saltando
      if (state === 'JUMPING') {
        frog.x += frog.vx;
        if (frog.isGrounded) {
          frog.vy = -12;
          frog.isGrounded = false;
        } else {
          frog.vy += 0.6; // Gravedad
          frog.y += frog.vy;
          if (frog.y >= frog.baseY) {
            frog.y = frog.baseY;
            frog.isGrounded = true;
          }
        }

        // Cuando llega al centro, se detiene y espera a la mosca
        if (frog.x >= 360) {
          frog.x = 360;
          frog.y = frog.baseY;
          state = 'FLY_WAIT';
        }
      }

      // 2. Aparece la mosca volando
      if (state === 'FLY_WAIT' || state === 'CATCHING') {
        if (!fly.caught) {
          fly.x += fly.vx;
          fly.y += Math.sin(frame * 0.1) * 2; // Vuelo ondulado
        }

        // Iniciar tiro de lengua cuando la mosca esté cerca
        if (fly.x <= 520 && state === 'FLY_WAIT') {
          state = 'CATCHING';
        }
      }

      // 3. Mecánica de la lengua
      if (state === 'CATCHING') {
        frog.mouthOpen = true;
        if (!fly.caught) {
          frog.tongueProgress += 0.08;
          if (frog.tongueProgress >= 1) {
            frog.tongueProgress = 1;
            fly.caught = true;
          }
        } else {
          // Retroceder lengua con la mosca
          frog.tongueProgress -= 0.08;
          fly.x = frog.x + 35 + (500 - (frog.x + 35)) * frog.tongueProgress;
          fly.y = frog.y - 10 + (180 - (frog.y - 10)) * frog.tongueProgress;

          if (frog.tongueProgress <= 0) {
            frog.tongueProgress = 0;
            fly.visible = false;
            frog.mouthOpen = false;
            state = 'SWALLOWING';
          }
        }
      }

      // 4. Tragar
      if (state === 'SWALLOWING') {
        frog.swallowScale = 1 + Math.sin(frame * 0.3) * 0.25;
        if (frame % 40 === 0) {
          frog.swallowScale = 1;
          state = 'SHOWING_LETTER';
        }
      }

      // 5. Mostrar la carta
      if (state === 'SHOWING_LETTER') {
        frog.mouthOpen = true;
        if (letter.scale < 1) {
          letter.scale += 0.03;
          letter.yOffset -= 1.5;
        } else {
          // Después de mostrar la carta, se la "traga de vuelta" y explota
          setTimeout(() => {
            if (state === 'SHOWING_LETTER') {
              state = 'EXPLODING';
              createExplosion();
            }
          }, 1800);
        }
      }

      // 6. Actualizar corazones flotantes
      particles.forEach((p, index) => {
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.008;
        p.scale += 0.005;
        if (p.alpha <= 0) particles.splice(index, 1);
      });
    }

    // --- DIBUJO DE ELEMENTOS ---

    function drawBackground() {
      // Flores / Vegetación de fondo
      ctx.fillStyle = '#6db380';
      ctx.beginPath();
      ctx.arc(100, 480, 120, 0, Math.PI * 2);
      ctx.arc(700, 480, 150, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawFrog() {
      ctx.save();
      ctx.translate(frog.x, frog.y);
      ctx.scale(1, frog.swallowScale);

      // Cuerpo
      ctx.fillStyle = '#4CAF50';
      ctx.beginPath();
      ctx.ellipse(35, 30, 35, 25, 0, 0, Math.PI * 2);
      ctx.fill();

      // Patas traseras
      ctx.fillStyle = '#388E3C';
      ctx.beginPath();
      ctx.ellipse(5, 42, 18, 10, -0.3, 0, Math.PI * 2);
      ctx.ellipse(65, 42, 18, 10, 0.3, 0, Math.PI * 2);
      ctx.fill();

      // Ojos
      ctx.fillStyle = '#FFF';
      ctx.beginPath();
      ctx.arc(18, 5, 12, 0, Math.PI * 2);
      ctx.arc(52, 5, 12, 0, Math.PI * 2);
      ctx.fill();

      // Pupilas
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(20, 5, 5, 0, Math.PI * 2);
      ctx.arc(50, 5, 5, 0, Math.PI * 2);
      ctx.fill();

      // Lengua
      if (frog.tongueProgress > 0) {
        ctx.strokeStyle = '#FF5252';
        ctx.lineWidth = 8;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(35, 25);
        let targetX = 500 - frog.x;
        let targetY = 180 - frog.y;
        ctx.lineTo(35 + (targetX - 35) * frog.tongueProgress, 25 + (targetY - 25) * frog.tongueProgress);
        ctx.stroke();
      }

      // Boca
      ctx.fillStyle = '#D32F2F';
      ctx.beginPath();
      if (frog.mouthOpen) {
        ctx.arc(35, 28, 14, 0, Math.PI);
      } else {
        ctx.arc(35, 25, 15, 0.2, Math.PI - 0.2);
      }
      ctx.fill();

      ctx.restore();
    }

    function drawFly() {
      ctx.save();
      ctx.translate(fly.x, fly.y);

      // Alas
      ctx.fillStyle = "rgba(255, 255, 255, 0.7)";
      ctx.beginPath();
      ctx.ellipse(-3, -6, 6, 3, -0.5, 0, Math.PI * 2);
      ctx.ellipse(3, -6, 6, 3, 0.5, 0, Math.PI * 2);
      ctx.fill();

      // Cuerpo
      ctx.fillStyle = "#212121";
      ctx.beginPath();
      ctx.arc(0, 0, 6, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function drawLetter() {
      ctx.save();
      ctx.translate(frog.x + 35, frog.y - 10 + letter.yOffset);
      ctx.scale(letter.scale, letter.scale);

      // Sobre / Cartita
      ctx.fillStyle = "#FFF";
      ctx.strokeStyle = "#E0E0E0";
      ctx.lineWidth = 2;
      ctx.fillRect(-45, -30, 90, 60);
      ctx.strokeRect(-45, -30, 90, 60);

      // Solapa de la carta
      ctx.fillStyle = "#FFEBEE";
      ctx.beginPath();
      ctx.moveTo(-45, -30);
      ctx.lineTo(0, 0);
      ctx.lineTo(45, -30);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Texto
      ctx.fillStyle = "#D81B60";
      ctx.font = "bold 14px Arial";
      ctx.textAlign = "center";
      ctx.fillText(letter.text, 0, 18);

      ctx.restore();
    }

    // Creación de la explosión de corazones
    function createExplosion() {
      for (let i = 0; i < 60; i++) {
        let angle = Math.random() * Math.PI * 2;
        let speed = Math.random() * 6 + 2;
        particles.push({
          x: frog.x + 35,
          y: frog.y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1,
          size: Math.random() * 15 + 10,
          alpha: 1,
          scale: 1,
          color: `hsl(${Math.random() * 40 + 330}, 100%, 65%)`
        });
      }
    }

    function drawParticles() {
      particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.translate(p.x, p.y);
        ctx.fillStyle = p.color;
        
        // Dibujar forma de corazón
        ctx.beginPath();
        let topCurveHeight = p.size * 0.3;
        ctx.moveTo(0, topCurveHeight);
        ctx.bezierCurveTo(0, 0, -p.size / 2, 0, -p.size / 2, topCurveHeight);
        ctx.bezierCurveTo(-p.size / 2, (p.size + topCurveHeight) / 2, 0, p.size, 0, p.size);
        ctx.bezierCurveTo(0, p.size, p.size / 2, (p.size + topCurveHeight) / 2, p.size / 2, topCurveHeight);
        ctx.bezierCurveTo(p.size / 2, 0, 0, 0, 0, topCurveHeight);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
      });
    }

    // Iniciar la animación
    animate();
  </script>
</body>
</html>
